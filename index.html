<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0c1116" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>AURA Charts</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg: #0c1116;
      --bg2: #111820;
      --bg3: #1a2330;
      --text: #e7eef5;
      --text-muted: #8a9bb0;
      --border: #1e2a38;
      --gold: #e3a45a;
      --coral: #e36a5c;
      --up: #26a69a;
      --down: #ef5350;
    }
    body.light {
      --bg: #f5f7fa;
      --bg2: #ffffff;
      --bg3: #eef2f7;
      --text: #1a2330;
      --text-muted: #5a6b7d;
      --border: #e0e6ed;
      --gold: #c48a3a;
      --coral: #d45a4c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
    .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

    header {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      flex-shrink: 0;
    }
    .top-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .logo { font-weight: 650; font-size: 1.05rem; letter-spacing: -0.3px; color: var(--gold); }
    .symbol-info { display: flex; align-items: baseline; gap: 10px; margin-left: 8px; }
    .symbol-name { font-weight: 600; font-size: 1rem; }
    #priceInfo { font-size: 0.95rem; font-weight: 550; font-variant-numeric: tabular-nums; }
    #status { font-size: 0.7rem; color: var(--text-muted); margin-left: auto; }
    .theme-btn {
      background: transparent; border: 1px solid var(--border); color: var(--text);
      padding: 5px 12px; border-radius: 6px; font-size: 0.7rem; cursor: pointer;
    }
    .theme-btn:hover { background: var(--bg3); }

    .toolbar { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
    .btn-group { display: flex; gap: 4px; flex-wrap: wrap; }
    button.tf, button.pair, .replay-controls button {
      background: transparent; color: var(--text-muted); border: 1px solid transparent;
      padding: 5px 10px; border-radius: 6px; font-size: 0.72rem; cursor: pointer; transition: all 0.12s;
    }
    button.tf.active, button.pair.active,
    button.tf:hover, button.pair:hover,
    .replay-controls button:hover {
      background: var(--bg3); color: var(--text); border-color: var(--border);
    }
    button.tf.active, button.pair.active {
      background: var(--gold); color: #0c1116; border-color: var(--gold);
    }

    .replay-controls { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
    .replay-controls button { min-width: 52px; padding: 5px 8px; font-size: 0.68rem; }
    #replayInfo { font-size: 0.65rem; color: var(--text-muted); margin-left: 8px; }

    .legend { display: flex; gap: 14px; font-size: 0.65rem; color: var(--text-muted); margin-top: 8px; flex-wrap: wrap; }
    .legend span { display: flex; align-items: center; gap: 5px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; }

    #chart { flex: 1; width: 100%; min-height: 0; background: var(--bg); }

    .bottom-bar {
      background: var(--bg2);
      border-top: 1px solid var(--border);
      padding: 8px 16px;
      font-size: 0.78rem;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    #dateTime {
      font-weight: 550;
      font-variant-numeric: tabular-nums;
    }
    #ohlc {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 700px) {
      header { padding: 8px 12px; }
      .logo { font-size: 0.95rem; }
      .symbol-name { font-size: 0.9rem; }
      #priceInfo { font-size: 0.82rem; }
      .toolbar { gap: 6px; margin-top: 8px; }
      .replay-controls { margin-left: 0; width: 100%; }
      .replay-controls button { min-width: 48px; padding: 4px 6px; font-size: 0.64rem; }
      .bottom-bar { padding: 6px 12px; font-size: 0.72rem; }
      #ohlc { font-size: 0.65rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="top-bar">
        <span class="logo">AURA</span>
        <div class="symbol-info">
          <span class="symbol-name" id="symbolName">EURUSD</span>
          <span id="priceInfo">—</span>
        </div>
        <span id="status">Cargando…</span>
        <button class="theme-btn" id="themeBtn">Claro</button>
      </div>

      <div class="toolbar">
        <div class="btn-group" id="timeframes">
          <button class="tf" data-tf="1m">1m</button>
          <button class="tf" data-tf="5m">5m</button>
          <button class="tf active" data-tf="15m">15m</button>
          <button class="tf" data-tf="1h">1H</button>
          <button class="tf" data-tf="4h">4H</button>
          <button class="tf" data-tf="1d">1D</button>
        </div>
        <div class="btn-group" id="pairs">
          <button class="pair active" data-pair="EURUSD=X">EURUSD</button>
          <button class="pair" data-pair="GBPUSD=X">GBPUSD</button>
          <button class="pair" data-pair="USDJPY=X">USDJPY</button>
          <button class="pair" data-pair="GC=F">XAUUSD</button>
        </div>
        <div class="replay-controls">
          <button id="btnStart">Inicio</button>
          <button id="btnStep">Paso</button>
          <button id="btnPlay">Play</button>
          <button id="btnPause">Pausa</button>
          <button id="btnMarkBuy">Compra</button>
          <button id="btnMarkSell">Venta</button>
          <button id="btnClear">Limpiar</button>
          <span id="replayInfo"></span>
        </div>
      </div>

      <div class="legend">
        <span><i class="dot" style="background:#5b8cff"></i> Tokio</span>
        <span><i class="dot" style="background:#7eb6ff"></i> Londres</span>
        <span><i class="dot" style="background:#e3a45a"></i> Nueva York</span>
        <span><i class="dot" style="background:#e36a5c"></i> -20m NY</span>
      </div>
    </header>

    <div id="chart"></div>

    <div class="bottom-bar">
      <span id="dateTime">—</span>
      <span id="ohlc">—</span>
    </div>
  </div>

  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
    const container = document.getElementById('chart');
    const statusEl = document.getElementById('status');
    const priceInfo = document.getElementById('priceInfo');
    const symbolName = document.getElementById('symbolName');
    const themeBtn = document.getElementById('themeBtn');
    const replayInfo = document.getElementById('replayInfo');
    const dateTimeEl = document.getElementById('dateTime');
    const ohlcEl = document.getElementById('ohlc');

    let chart, candleSeries, volumeSeries, sessionSeries, markers = [];
    let fullData = [], visibleCount = 0, playing = false, playTimer = null, replayMode = false;
    let currentPair = localStorage.getItem('aura-pair') || 'EURUSD=X';
    let currentTf = localStorage.getItem('aura-tf') || '15m';

    const pairLabels = {
      'EURUSD=X': 'EURUSD',
      'GBPUSD=X': 'GBPUSD',
      'USDJPY=X': 'USDJPY',
      'GC=F': 'XAUUSD'
    };

    const tfMap = {
      '1m':  { interval: '1m',  range: '7d' },
      '5m':  { interval: '5m',  range: '60d' },
      '15m': { interval: '15m', range: '60d' },
      '1h':  { interval: '60m', range: '2y' },
      '4h':  { interval: '1d',  range: '5y' },
      '1d':  { interval: '1d',  range: '10y' },
    };

    function formatDateTime(timestamp) {
      const d = new Date(timestamp * 1000);
      const days = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
      const months = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
      const dayName = days[d.getUTCDay()];
      const day = d.getUTCDate();
      const month = months[d.getUTCMonth()];
      const year = d.getUTCFullYear();
      const hh = String(d.getUTCHours()).padStart(2, '0');
      const mm = String(d.getUTCMinutes()).padStart(2, '0');
      return `${dayName} ${day} ${month} ${year}  ${hh}:${mm} UTC`;
    }

    function updateBottomInfo(bar) {
      if (!bar) {
        dateTimeEl.textContent = '—';
        ohlcEl.textContent = '—';
        return;
      }
      dateTimeEl.textContent = formatDateTime(bar.time);
      ohlcEl.textContent = `O ${bar.open.toFixed(5)}  H ${bar.high.toFixed(5)}  L ${bar.low.toFixed(5)}  C ${bar.close.toFixed(5)}`;
    }

    function applyTheme(isLight) {
      document.body.classList.toggle('light', isLight);
      themeBtn.textContent = isLight ? 'Oscuro' : 'Claro';
      localStorage.setItem('aura-theme', isLight ? 'light' : 'dark');
      if (chart) {
        chart.applyOptions({
          layout: { background: { color: isLight ? '#f5f7fa' : '#0c1116' }, textColor: isLight ? '#1a2330' : '#e7eef5' },
          grid: { vertLines: { color: isLight ? '#e8eef5' : '#1a2330' }, horzLines: { color: isLight ? '#e8eef5' : '#1a2330' } },
        });
      }
    }

    function createChart() {
      if (chart) chart.remove();
      const isLight = document.body.classList.contains('light');
      chart = LightweightCharts.createChart(container, {
        width: container.clientWidth,
        height: container.clientHeight,
        layout: {
          background: { color: isLight ? '#f5f7fa' : '#0c1116' },
          textColor: isLight ? '#1a2330' : '#e7eef5',
        },
        grid: {
          vertLines: { color: isLight ? '#e8eef5' : '#1a2330' },
          horzLines: { color: isLight ? '#e8eef5' : '#1a2330' },
        },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        rightPriceScale: {
          borderColor: '#2a3544',
          scaleMargins: { top: 0.1, bottom: 0.15 },
        },
        timeScale: {
          borderColor: '#2a3544',
          timeVisible: true,
          secondsVisible: false,
          rightOffset: 5,
        },
      });

      candleSeries = chart.addCandlestickSeries({
        upColor: '#26a69a',
        downColor: '#ef5350',
        borderUpColor: '#26a69a',
        borderDownColor: '#ef5350',
        wickUpColor: '#26a69a',
        wickDownColor: '#ef5350',
      });

      volumeSeries = chart.addHistogramSeries({
        color: '#5b8cff',
        priceFormat: { type: 'volume' },
        priceScaleId: '',
      });
      chart.priceScale('').applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });

      sessionSeries = chart.addHistogramSeries({
        color: 'rgba(0,0,0,0)',
        priceScaleId: 'left',
        priceFormat: { type: 'volume' },
      });
      chart.priceScale('left').applyOptions({ visible: false, scaleMargins: { top: 0, bottom: 0 } });

      chart.subscribeCrosshairMove(param => {
        if (!param.time || !fullData.length) {
          const last = replayMode ? fullData[visibleCount - 1] : fullData.at(-1);
          updateBottomInfo(last);
          return;
        }
        const bar = fullData.find(b => b.time === param.time);
        if (bar) updateBottomInfo(bar);
      });
    }

    async function fetchYahooData(symbol, interval, range) {
      const url = `https://proxy.cors.dev/https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?interval=${interval}&range=${range}`;
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 15000);
      try {
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timeout);
        if (!res.ok) throw new Error('Error de red');
        const json = await res.json();
        const result = json.chart?.result?.[0];
        if (!result) throw new Error('Sin datos');
        const timestamps = result.timestamp || [];
        const quote = result.indicators?.quote?.[0] || {};
        const data = [], volData = [];
        for (let i = 0; i < timestamps.length; i++) {
          const o = quote.open?.[i], h = quote.high?.[i], l = quote.low?.[i], c = quote.close?.[i], v = quote.volume?.[i];
          if (o == null || h == null || l == null || c == null) continue;
          data.push({ time: timestamps[i], open: +o.toFixed(5), high: +h.toFixed(5), low: +l.toFixed(5), close: +c.toFixed(5) });
          if (v != null) volData.push({ time: timestamps[i], value: v, color: c >= o ? '#26a69a66' : '#ef535066' });
        }
        return { data, volData };
      } catch (e) { clearTimeout(timeout); throw e; }
    }

    function getSessionColor(hourUTC, minuteUTC) {
      if (hourUTC === 14 && minuteUTC >= 10 && minuteUTC < 30) return 'rgba(227, 106, 92, 0.28)';
      if (hourUTC >= 0 && hourUTC < 9) return 'rgba(91, 140, 255, 0.14)';
      if (hourUTC >= 8 && hourUTC < 17) return 'rgba(126, 182, 255, 0.12)';
      if (hourUTC >= 14 && hourUTC < 21) return 'rgba(227, 164, 90, 0.14)';
      return 'rgba(0,0,0,0)';
    }

    function markSessions(data) {
      const sessionData = data.map(bar => {
        const date = new Date(bar.time * 1000);
        const color = getSessionColor(date.getUTCHours(), date.getUTCMinutes());
        return { time: bar.time, value: color !== 'rgba(0,0,0,0)' ? 1 : 0, color };
      });
      sessionSeries.setData(sessionData);
    }

    function updatePriceInfo(data) {
      if (!data.length) return;
      const last = data[data.length - 1];
      const prev = data[data.length - 2] || last;
      const change = last.close - prev.close;
      const pct = (change / prev.close) * 100;
      const sign = change >= 0 ? '+' : '';
      priceInfo.textContent = `${last.close.toFixed(5)}  ${sign}${change.toFixed(5)} (${sign}${pct.toFixed(2)}%)`;
      priceInfo.style.color = change >= 0 ? '#26a69a' : '#ef5350';
    }

    function renderVisible() {
      const slice = replayMode ? fullData.slice(0, visibleCount) : fullData;
      const volSlice = fullData.volData ? (replayMode ? fullData.volData.slice(0, visibleCount) : fullData.volData) : [];
      candleSeries.setData(slice);
      volumeSeries.setData(volSlice);
      markSessions(slice);
      updatePriceInfo(slice);
      candleSeries.setMarkers(markers.filter(m => m.time <= (slice.at(-1)?.time || 0)));
      const lastBar = slice.at(-1);
      updateBottomInfo(lastBar);
      if (replayMode) {
        replayInfo.textContent = `${visibleCount}/${fullData.length}`;
      } else {
        replayInfo.textContent = `${fullData.length} velas`;
      }
    }

    async function loadData() {
      statusEl.textContent = 'Cargando…';
      const tf = tfMap[currentTf] || tfMap['15m'];
      localStorage.setItem('aura-pair', currentPair);
      localStorage.setItem('aura-tf', currentTf);
      symbolName.textContent = pairLabels[currentPair] || currentPair;
      replayMode = false;

      try {
        const { data, volData } = await fetchYahooData(currentPair, tf.interval, tf.range);
        if (!data.length) throw new Error('Sin datos');
        fullData = data;
        fullData.volData = volData;
        visibleCount = data.length;
        markers = [];
        renderVisible();
        chart.timeScale().fitContent();
        statusEl.textContent = '';
      } catch (err) {
        statusEl.textContent = 'Error · reintentando';
        console.warn(err);
        setTimeout(loadData, 5000);
      }
    }

    function stepForward() {
      if (!replayMode) { replayMode = true; visibleCount = Math.min(50, fullData.length); }
      if (visibleCount < fullData.length) { visibleCount++; renderVisible(); }
    }

    function startReplay() {
      if (!fullData.length) return;
      replayMode = true;
      visibleCount = Math.min(40, fullData.length);
      markers = [];
      renderVisible();
    }

    function play() {
      if (playing || !fullData.length) return;
      if (!replayMode) startReplay();
      playing = true;
      playTimer = setInterval(() => {
        if (visibleCount >= fullData.length) { pause(); return; }
        stepForward();
      }, 280);
    }

    function pause() { playing = false; clearInterval(playTimer); }

    function markTrade(type) {
      if (!fullData.length) return;
      const idx = replayMode ? visibleCount - 1 : fullData.length - 1;
      if (idx < 0) return;
      const bar = fullData[idx];
      markers.push({
        time: bar.time,
        position: type === 'buy' ? 'belowBar' : 'aboveBar',
        color: type === 'buy' ? '#26a69a' : '#ef5350',
        shape: type === 'buy' ? 'arrowUp' : 'arrowDown',
        text: type === 'buy' ? 'C' : 'V',
      });
      renderVisible();
    }

    document.querySelectorAll('#pairs .pair').forEach(b => b.classList.toggle('active', b.dataset.pair === currentPair));
    document.querySelectorAll('#timeframes .tf').forEach(b => b.classList.toggle('active', b.dataset.tf === currentTf));
    if (localStorage.getItem('aura-theme') === 'light') applyTheme(true);
    themeBtn.addEventListener('click', () => applyTheme(!document.body.classList.contains('light')));
    createChart();
    loadData();

    document.getElementById('pairs').addEventListener('click', e => {
      const btn = e.target.closest('button'); if (!btn) return;
      currentPair = btn.dataset.pair;
      document.querySelectorAll('#pairs .pair').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadData();
    });

    document.getElementById('timeframes').addEventListener('click', e => {
      const btn = e.target.closest('button'); if (!btn) return;
      currentTf = btn.dataset.tf;
      document.querySelectorAll('#timeframes .tf').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadData();
    });

    document.getElementById('btnStart').onclick = startReplay;
    document.getElementById('btnStep').onclick = stepForward;
    document.getElementById('btnPlay').onclick = play;
    document.getElementById('btnPause').onclick = pause;
    document.getElementById('btnMarkBuy').onclick = () => markTrade('buy');
    document.getElementById('btnMarkSell').onclick = () => markTrade('sell');
    document.getElementById('btnClear').onclick = () => { markers = []; renderVisible(); };

    window.addEventListener('resize', () => {
      chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
    });
  </script>
</body>
</html>
